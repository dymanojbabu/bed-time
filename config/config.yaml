story:
  age_range: "6-7"
  max_words: 350

# Themes rotate randomly each day
themes:
  - saving money and piggy banks
  - sharing with friends
  - being honest even when it is hard
  - finishing what you start
  - keeping your room tidy
  - trying new foods
  - being kind to animals
  - helping at home
  - taking turns and being patient
  - brushing teeth and healthy habits
  - counting coins and making change
  - spending wisely vs. impulse buying
  - earning money by doing chores
  - giving to others who need help
  - setting a goal and working toward it
  - teamwork makes things easier
  - apologizing and making things right
  - taking care of books and toys
  - being brave when scared
  - gratitude and saying thank you

