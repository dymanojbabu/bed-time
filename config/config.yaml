model:
  # gemini-1.5-flash is free: 1,500 requests/day, 1M tokens/min
  # Change to gemini-1.5-pro for richer (but slower) stories
  id: "gemini-flash-latest"

scheduler:
  # 24-hour format — story generates at this time every day
  time: "20:00"
  # Set to true to also generate a story immediately when the scheduler starts
  run_on_start: false
